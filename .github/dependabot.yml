version: 2

# Watch the Jellyfin SDK for ABI surprises (incident: 10.11.9 silently removed
# IUserManager.Users, broke v1.12.0 on every 10.11.9+ server, only surfaced
# via user reports). With this in place, Dependabot opens a PR the day a new
# Jellyfin.Controller / Jellyfin.Model ships, CI runs the test suite against
# the new ABI, and a human decides whether to take the bump.
#
# FLOOR POLICY (issue #63): these PRs are a SIGNAL, not something to merge
# casually. Jellyfin assemblies carry full per-patch AssemblyVersions, so the
# SDK version we build against is the real minimum Jellyfin a release loads
# on. Merging an SDK bump = raising the floor = excluding users on older
# Jellyfin. Only take a bump when we actually need the new API, and raise
# targetAbi.txt + minor version in the same PR. version-gate.yml refuses
# any PR where the SDK version != targetAbi.txt, and any targetAbi change
# without a minor bump, and any PR without a version bump at all. Let the
# Dependabot PR sit open as a green/red compile signal otherwise.
#
# The two Jellyfin.* entries below are that signal. Everything else (other
# NuGet packages, the site's npm packages, the workflow actions) gets its own
# weekly, grouped entry further down so security fixes are not missed. PR commit
# prefixes are "build"/"ci" so pr-title.yml accepts them.

updates:
  - package-ecosystem: nuget
    directory: /LetterboxdSync
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "Jellyfin.*"
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - jellyfin-sdk

  # Tests project: same allowlist, lower frequency. Test-only dep bumps don't
  # ship to users, so weekly is plenty.
  - package-ecosystem: nuget
    directory: /LetterboxdSync.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "Jellyfin.*"
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - jellyfin-sdk

  # Every other NuGet package, in both projects (found through the solution at
  # the repo root), as one grouped weekly PR. Jellyfin.* is ignored here because
  # the two entries above own it. Newtonsoft.Json and Microsoft.AspNetCore.* are
  # resolved from the Jellyfin host at runtime (only Jellyscribe.dll and
  # HtmlAgilityPack.dll ship), so a bump past the host's copy could fail to load;
  # they stay with the host. Microsoft.Extensions.* majors track .NET itself (10.x
  # needs net10.0, see the Jellyfin 12 notes in CLAUDE.md), so only minor/patch.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "Jellyfin.*"
      - dependency-name: "Newtonsoft.Json"
      - dependency-name: "Microsoft.AspNetCore.*"
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies

  # Site (jellyscribe.dev). Build-time only; nothing here ships in the plugin.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      site:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies

  # Workflow actions are pinned to commit SHAs; this keeps the pins (and their
  # version comments) moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
