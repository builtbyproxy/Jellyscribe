name: Integration tests (live Letterboxd)

# Runs on PRs that can change plugin behaviour, and on demand. Hits real
# letterboxd.com using a dedicated test account, writes to its diary, and cleans
# up after itself. Cost is low but non-zero (Cloudflare quota, brief diary
# residue mid-run). The steps live in live-tests.yml, which also says which
# secrets are used and what happens when they are missing (fork PRs skip and
# pass, so external contributors aren't blocked).
#
# There is no push-to-main trigger: release.yml runs the same suite against the
# commit it is about to ship, and a second run on that commit at the same time
# would trample the shared test account. Main is also checked weekly by
# live-checks.yml.
on:
  # Paths filter: skip the suite on PRs that only touch docs, site, manifest,
  # deploy scripts, etc., anything that can't change plugin behaviour. Manual
  # workflow_dispatch has no filter.
  pull_request:
    paths:
      - 'LetterboxdSync/**'
      - 'LetterboxdSync.Tests/**'
      - 'Directory.Build.props'
      - 'LetterboxdSync.sln'
      - '.github/workflows/integration.yml'
      - '.github/workflows/live-tests.yml'
      - '.github/scripts/live_test_summary.py'
  workflow_dispatch:

# Every run writes to the same live Letterboxd test account (the rating probes set and restore
# one film's rating), so runs from several PRs at once trample each other's state. Queue them.
concurrency:
  group: letterboxd-test-account
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/live-tests.yml
    secrets:
      LETTERBOXD_TEST_USERNAME: ${{ secrets.LETTERBOXD_TEST_USERNAME }}
      LETTERBOXD_TEST_PASSWORD: ${{ secrets.LETTERBOXD_TEST_PASSWORD }}
      LETTERBOXD_TEST_RAW_COOKIES: ${{ secrets.LETTERBOXD_TEST_RAW_COOKIES }}
      LETTERBOXD_TEST_USER_AGENT: ${{ secrets.LETTERBOXD_TEST_USER_AGENT }}
