name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'manifest.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  # Auto-deploy after every successful Release. The Release workflow's
  # manifest commit is pushed with the release deploy key, which starts the
  # push trigger above and a second (skipping) Release run, so a release
  # triggers three deploys. The pages group below runs one at a time and
  # cancels a queued run that a newer one replaces, so the site ends current.
  # This trigger stays because a GITHUB_TOKEN push (the rollback for the deploy
  # key) starts no workflows, and without it the site would go stale on every
  # release, as it did after v1.12.0 and v1.13.0.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # When triggered by Release completion, only deploy if Release succeeded.
    # For other triggers (push, workflow_dispatch) always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with Astro
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          path: ./site
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
