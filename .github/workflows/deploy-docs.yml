name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'manifest.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  # Auto-deploy after every successful Release. The Release workflow's
  # manifest commit is pushed with the release deploy key, which starts the
  # push trigger above too, so a release deploys twice; the pages group below
  # runs them one after the other and the second republishes the same build.
  # This trigger stays because a GITHUB_TOKEN push (the rollback for the deploy
  # key) starts no workflows, and without it the site would go stale on every
  # release, as it did after v1.12.0 and v1.13.0.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # When triggered by Release completion, only deploy if Release succeeded.
    # For other triggers (push, workflow_dispatch) always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build with Astro
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3.0.2
        with:
          path: ./site
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
